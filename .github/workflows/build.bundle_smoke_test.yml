name: Bundle Smoke Test
on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'The commit SHA to use for the build'
        required: false
        default: ''
        type: string

permissions:
  id-token: write # Required for GCP Workload Identity for failure notifications
  contents: read

jobs:
  check_release_pr:
    runs-on: ubuntu-24.04
    name: Check if this is a release PR
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for [release] tag
        id: check
        shell: bash
        run: |
          last_commit_msg=$(git log -1 --pretty=%B)
          echo "Last commit message: $last_commit_msg"
          if [[ "$last_commit_msg" == *"[release]"* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  bundle_smoke_test:
    needs: check_release_pr
    # if: needs.check_release_pr.outputs.is_release == 'true'
    runs-on: self-hosted-k8s-large
    name: Build bundle and smoke-test startup
    container:
      image: us-central1-docker.pkg.dev/da-cn-shared/ghcr/digital-asset/decentralized-canton-sync-dev/docker/splice-test-ci:0.3.12
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        id: setup
        uses: ./.github/actions/tests/common_test_setup
        with:
          cache_version: 10
          test_name: bundle_smoke_test

      - name: Build bundle
        uses: ./.github/actions/sbt/execute_sbt_command
        with:
          cmd: "bundle"

      - name: Smoke test bundle
        uses: ./.github/actions/nix/run_bash_command_in_nix
        with:
          cmd: |
            set -euo pipefail
            bundle_tar="apps/app/target/release/splice-node.tar.gz"
            test -f "$bundle_tar"
            smoke_dir=$(mktemp -d)
            tar -xzf "$bundle_tar" -C "$smoke_dir"
            # Running a simple command that initialises logging is enough to catch
            # packaging issues such as a missing or malformed logback.xml.
            smoke_conf="$smoke_dir/smoke.conf"
            cat > "$smoke_conf" <<'SMOKECONF'
            canton {}
            SMOKECONF
            echo "Running bundled splice-node generate remote-config"
            "$smoke_dir/splice-node/bin/splice-node" -c "$smoke_conf" generate remote-config

      - name: Post-SBT job
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sbt/post_sbt
        with:
          cache_version: 10
          setup_sbt_cache_hits: ${{ steps.setup.outputs.sbt_cache_hits }}

      - name: Report Failures on Slack & Github
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/tests/failure_notifications
        with:
          job_subname: "bundle_smoke_test"
          workload_identity_provider: '${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_SA }}'
          notifications_url: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_URL }}'
          slack_channel: '${{ secrets.FAILURE_NOTIFICATIONS_SLACK_CHANNEL }}'
