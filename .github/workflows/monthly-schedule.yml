name: Monthly Schedule

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Splice version, e.g. 0.8"
        required: true
        type: string

      month:
        description: "Month in YYYY-MM format, e.g. 2026-08"
        required: true
        type: string

      dry_run:
        description: "Dry run only — do not modify Monday"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  create-schedule:
    runs-on: ubuntu-latest

    environment: monday-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create monthly schedule
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID: ${{ vars.MONDAY_BOARD_ID }}
        shell: bash
        run: |
          ARGS=(
            "${{ inputs.version }}"
            "${{ inputs.month }}"
          )

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=("--dry-run")
          fi

          python3 scripts/monthly-schedule.py "${ARGS[@]}"