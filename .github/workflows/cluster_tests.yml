name: Trigger a cluster test

on:
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      sha:
        type: string
        required: true

    outputs:
      result:
        description: the result of invoking the CCI pipeline
        value: ${{ jobs.trigger_cluster_test.outputs.result }}

jobs:
  trigger_cluster_test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.trigger.outputs.result }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate
        id: auth
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' #v3.0.0
        with:
          token_format: id_token
          workload_identity_provider: '${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}'
          create_credentials_file: false
          service_account: '${{ secrets.CLUSTER_TEST_INVOKER_SA }}'
          id_token_audience: '${{ secrets.CLUSTER_TEST_INVOKER_URL }}'
          id_token_include_email: true

      - name: Trigger cluster test
        id: trigger
        run: |
          set -euo pipefail
          if ! result=$(curl -sSL -X POST --fail-with-body \
            --retry 3 --retry-delay 10 --retry-max-time 60 \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${{ steps.auth.outputs.id_token }}" \
            "${{ secrets.CLUSTER_TEST_INVOKER_URL }}?workflow=${{ inputs.workflow }}&splice-git-ref=${{ inputs.sha }}"); then
            echo "::error::Failed to trigger cluster test workflow '${{ inputs.workflow }}' for sha '${{ inputs.sha }}'"
            echo "Response body: $result"
            exit 1
          fi
          echo "Triggered ${{ inputs.workflow }}: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Report Failures on Slack & Github
        if: failure()
        uses: ./.github/actions/tests/failure_notifications
        with:
          job_subname: ${{ inputs.workflow }}
          workload_identity_provider: '${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_SA }}'
          notifications_url: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_URL }}'
          slack_channel: '${{ secrets.FAILURE_NOTIFICATIONS_SLACK_CHANNEL }}'
