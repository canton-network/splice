name: Multi-arch image check

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  check_multiarch_images:
    name: Check that pinned Docker images are multi-arch
    # Only run for PRs from the same repo (not forks), because the check needs
    # self-hosted runners with registry access.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: self-hosted-k8s-x-small
    timeout-minutes: 15
    container:
      image: us-central1-docker.pkg.dev/da-cn-shared/ghcr/digital-asset/decentralized-canton-sync-dev/docker/splice-test-ci:0.3.12
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix
        uses: ./.github/actions/nix/setup_nix
        with:
          cache_version: 9
          target: 'static_tests'

      - name: Check that pinned docker images are multi-arch
        uses: ./.github/actions/nix/run_bash_command_in_nix
        with:
          cmd: ./scripts/check-multiarch-images.py
