
name: Post cluster test instructions on a PR
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] gated by OWNER/MEMBER check
    types: [created]
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      pr_number:
        type: number
        required: true
permissions:
  contents: read
  pull-requests: write # To comment back on the PR # zizmor: ignore[excessive-permissions]

jobs:

  cluster_test_instructions:
    runs-on: ubuntu-24.04
    # Only react to issue comments from repository members/collaborators.
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(fromJson('["OWNER", "MEMBER"]'), github.event.comment.author_association))
    steps:
      - name: Comment instructions on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS_WORKFLOW: ${{ inputs.workflow }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            // The test is triggered by a maintainer with cncluster; this job only tells them how.
            const tests = {
              cluster_test: { label: 'a cluster test', subcommand: 'deploy_basic' },
              upgrade_test: { label: 'an upgrade test', subcommand: 'deploy_upgrade' },
              lsu_test: { label: 'a logical synchronizer upgrade (LSU) test', subcommand: 'deploy_lsu' },
            };

            let workflow = process.env.INPUTS_WORKFLOW || '';
            if (workflow === '') {
              const body = context.payload.comment.body || '';
              workflow = Object.keys(tests).find((name) => body.includes(`/${name}`)) || '';
            }
            const test = tests[workflow];
            if (!test) {
              core.info('No cluster test requested.');
              return;
            }

            const prNumber = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `To run ${test.label} on this PR, a maintainer can run the following from a scratchnet checkout (\`cluster/deployment/<scratchnet>\`):\n\n\`cncluster ${test.subcommand} ${prNumber}\`\n\nThis grabs the cluster lock if free (use \`cncluster lock\` to lock explicitly), triggers the deploy workflow, and posts the run link back on this PR. Nothing was triggered by this comment.`
            });
