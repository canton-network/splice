name: Trigger a cluster test on a PR
on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      pr_number:
        type: number
        required: true
permissions:
  contents: read
  issues: read
  pull-requests: write # To comment back on the PR
  id-token: write

jobs:

  get_head:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    outputs:
      sha: ${{ steps.get_head.outputs.sha }}
      repo: ${{ steps.get_head.outputs.repo }}
    steps:
      - name: Get head SHA
        id: get_head
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number }}${{ inputs.pr_number }}"
          echo "PR number: $pr_number"
          query='query pullRequestDetails { repository(name: \"${{ github.event.repository.name }}\", owner: \"${{ github.repository_owner }}\") { pullRequest(number: '"$pr_number"') { headRef { target { oid } } } } }'
          echo "query: $query"
          result=$(curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -X POST -d " { \"query\": \"$query\" } " https://api.github.com/graphql)
          if ! echo "$result" | jq empty > /dev/null 2>&1; then
            echo "GitHub API did not return valid JSON. Response: $result"
            exit 1
          fi
          sha=$(echo "$result" | jq -r '.data.repository.pullRequest.headRef.target.oid')
          if [ "$sha" == "null" ] || [ -z "$sha" ]; then
            echo "Failed to fetch SHA from API. Full response: $result"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  determine_test_type:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    outputs:
      workflow: ${{ steps.determine_test_type.outputs.workflow }}
    steps:
      - name: Determine test type
        id: determine_test_type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS_WORKFLOW: ${{ inputs.workflow }}
        with:
          script: |
            let workflow = '';

            if (process.env.INPUTS_WORKFLOW !== '') {
              workflow = process.env.INPUTS_WORKFLOW;
            } else {
              const body = context.payload.comment.body || '';
              
              if (body.includes('/cluster_test')) {
                workflow = 'cluster_test';
              } else if (body.includes('/hdm_test')) {
                workflow = 'hdm_test';
              } else if (body.includes('/lsu_test')) {
                workflow = 'lsu_test';
              } else if (body.includes('/upgrade_test')) {
                workflow = 'upgrade_test';
              }
            }

            core.setOutput('workflow', workflow);

  comment:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
    if: needs.determine_test_type.outputs.workflow != ''
    steps:
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.issue.number || ${{ inputs.pr_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `A DA internal contributor must manually trigger this cluster test for [commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${prNumber}/files/${{ needs.get_head.outputs.sha }}) by running the following command in the appropriate cluster deployment directory:\n\n\`\`\`\ncncluster run_workflow --workflow ${{ needs.determine_test_type.outputs.workflow }} ${{ needs.get_head.outputs.sha }}\n\`\`\``
            });
