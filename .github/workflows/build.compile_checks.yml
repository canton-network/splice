name: Compile, Checks and Docs
on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true

jobs:
  compile_checks:
    runs-on: self-hosted-k8s-medium
    container:
      image: us-central1-docker.pkg.dev/da-cn-shared/ghcr/digital-asset/decentralized-canton-sync-dev/docker/splice-test-ci:0.3.12

    steps:

      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        id: setup
        uses: ./.github/actions/tests/common_test_setup
        with:
          cache_version: 10
          test_name: compile_checks
          save_nix_cache: true
          save_nix_cache_to_gcp: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          upload_workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER_SPLICE }}
          upload_service_account: ${{ secrets.CACHE_UPLOADER_SA }}

      - name: Compile and build docs
        uses: ./.github/actions/sbt/execute_sbt_command
        with:
          # We Test/compile here as this job is the only one that saves the SBT caches
          # (it finishes fastest) and we want to ensure that they include test sources.
          cmd: "Test/compile docs/bundle"

      - name: Upload documentation artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs/html/html

      - name: Post-SBT job
        uses: ./.github/actions/sbt/post_sbt
        with:
          # The docs job is the only job that saves the sbt/classes/npm/Daml caches, see post_sbt.
          save_caches: true
          setup_sbt_cache_hits: ${{ steps.setup.outputs.sbt_cache_hits }}

      - name: Look up whether DarResources was already checked for these inputs
        id: dar_resources_checked
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /tmp/dar-resources-checked
          key: dar-resources-checked-1 ${{ hashFiles('daml/dars/**', 'daml/dars.lock', 'apps/dar-resources-generator/src/**', 'apps/common/src/main/scala/org/lfdecentralizedtrust/splice/environment/DarResources.scala', 'build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', '.scalafmt.conf', 'nix/canton-sources.json') }}
          lookup-only: true

      - name: Select checks for the changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ./.github/actions/scripts/select_checks.py build >> "$GITHUB_OUTPUT"

      - name: Checks that need the build
        uses: ./.github/actions/sbt/execute_sbt_command
        with:
          cmd: "lintCompiledJvm${{ steps.changes.outputs.npm_lint }}${{ steps.changes.outputs.test_config == 'true' && ' updateTestConfigForParallelRuns' || '' }}${{ steps.dar_resources_checked.outputs.cache-hit != 'true' && ' updateDarResources' || '' }}"

      - name: Verify no changes in SBT test files
        uses: ./.github/actions/nix/run
        with:
          cmd: git add . && git diff --staged --exit-code test*.log '**/DarResources.scala'

      - name: Mark DarResources as checked for these inputs
        if: steps.dar_resources_checked.outputs.cache-hit != 'true' && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/dar-resources-checked
          echo "${GITHUB_SHA}" > /tmp/dar-resources-checked/checked

      - name: Save the DarResources check marker
        if: steps.dar_resources_checked.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: /tmp/dar-resources-checked
          key: ${{ steps.dar_resources_checked.outputs.cache-primary-key }}

      - name: Report Failures on Slack & Github
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: ./.github/actions/tests/failure_notifications
        with:
          workload_identity_provider: '${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_SA }}'
          notifications_url: '${{ secrets.FAILURE_NOTIFICATIONS_INVOKER_URL }}'
          slack_channel: '${{ secrets.FAILURE_NOTIFICATIONS_SLACK_CHANNEL }}'
