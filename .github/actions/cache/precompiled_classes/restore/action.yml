name: "Restore Precompiled Classes"
description: "Restore the precompiled classes from the cache"
inputs:
  cache_version:
    description: "Version of the cache"
    required: true
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}
outputs:
  cache_hit:
    description: "Cache hit"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache_key:
    description: "Primary key of the cache. Pass it to the matching save action, so that the cache is saved under the key computed before the job modified any files."
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: "composite"
  steps:
    - name: Restore precompiled classes
      id: restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: /tmp/classes
        key: classes-${{ inputs.cache_version }} dependencies:${{ hashFiles(format('{0}/project/build.properties', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/project/DamlPlugin.scala', inputs.splice_root), format('{0}/project/Dependencies.scala', inputs.splice_root), format('{0}/project/CantonDependencies.scala', inputs.splice_root), format('{0}/project/Houserules.scala', inputs.splice_root), format('{0}/project/plugins.sbt', inputs.splice_root), format('{0}/build.sbt', inputs.splice_root), format('{0}/daml/dars.lock', inputs.splice_root), format('{0}/openapi-cache-key.txt', inputs.splice_root)) }} rev:${{ github.sha }}
        # A PR that changes a build file has no classes for its dependencies hash: start it from the newest classes of
        # its base branch, sbt recompiles what changed. Only PRs, as they never save caches; pushes to main/release-line
        # branches, which save the caches shared with all PRs, keep compiling from scratch after build file changes.
        restore-keys: |
          classes-${{ inputs.cache_version }} dependencies:${{ hashFiles(format('{0}/project/build.properties', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/project/DamlPlugin.scala', inputs.splice_root), format('{0}/project/Dependencies.scala', inputs.splice_root), format('{0}/project/CantonDependencies.scala', inputs.splice_root), format('{0}/project/Houserules.scala', inputs.splice_root), format('{0}/project/plugins.sbt', inputs.splice_root), format('{0}/build.sbt', inputs.splice_root), format('{0}/daml/dars.lock', inputs.splice_root), format('{0}/openapi-cache-key.txt', inputs.splice_root)) }}
          ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('classes-{0} dependencies:', inputs.cache_version) || '' }}
    - name: Extract precompiled classes
      uses: ./.github/actions/nix/run
      with:
        cmd: |
          set -euo pipefail
          if [[ -e /tmp/classes/classes.tar.gz ]]; then
            pushd ${{ inputs.splice_root }}
            tar --use-compress-program=pigz -xf /tmp/classes/classes.tar.gz
            # For some reason, the reset below may change file modification times stamps, if we don't run `git status`.
            git status
            # Reset changes to files under version control.
            git reset --hard
            # Delete untracked files, except for ignored files.
            git clean -fd
            echo "Finished restoring the pre-compiled cache files"
            popd
          else
            echo "No precompiled classes found. Skipping..."
          fi
