name: "Restore Daml artifacts"
description: "Restore the Daml artifacts cache"
inputs:
  cache_version:
    description: "Version of the cache"
    required: true
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}
outputs:
  cache_hit:
    description: "Cache hit"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache_key:
    description: "Primary key of the cache. Pass it to the matching save action, so that the cache is saved under the key computed before the job modified any files."
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: "composite"
  steps:
    - name: Restore Daml artifacts cache
      id: restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          /tmp/daml
          ${{ format('{0}/apps/common/frontend/daml.js', inputs.splice_root) }}
        key: daml-artifacts-${{ inputs.cache_version }} canton:${{ hashFiles(format('{0}/nix/canton-sources.json', inputs.splice_root)) }} dependencies:${{ hashFiles(format('{0}/project/build.properties', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/project/DamlPlugin.scala', inputs.splice_root), format('{0}/build.sbt', inputs.splice_root), format('{0}/daml/dars.lock', inputs.splice_root)) }} rev:${{ github.sha }}
        # A PR that changes a build file starts from the newest Daml artifacts of its base branch, sbt rebuilds the packages
        # whose sources changed. Only for the same Canton version: sbt does not rebuild when only the Daml compiler changed.
        # Only PRs, see precompiled_classes/restore.
        restore-keys: |
          daml-artifacts-${{ inputs.cache_version }} canton:${{ hashFiles(format('{0}/nix/canton-sources.json', inputs.splice_root)) }} dependencies:${{ hashFiles(format('{0}/project/build.properties', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/project/DamlPlugin.scala', inputs.splice_root), format('{0}/build.sbt', inputs.splice_root), format('{0}/daml/dars.lock', inputs.splice_root)) }}
          ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('daml-artifacts-{0} canton:{1} dependencies:', inputs.cache_version, hashFiles(format('{0}/nix/canton-sources.json', inputs.splice_root))) || '' }}
    - name: Extract Daml artifacts
      uses: ./.github/actions/nix/run
      with:
        cmd: |
          if [[ -e /tmp/daml/daml.tar.gz ]]; then
            tar --use-compress-program=pigz -xf /tmp/daml/daml.tar.gz
          else
            echo "No cached daml artifacts files found. Skipping..."
          fi
