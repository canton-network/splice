name: "Save SBT Cache"
description: "Saves the SBT cache"
inputs:
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}
  cache_key:
    description: "Key to save the cache under (should be the cache_key output from the matching restore action)"
    required: true
  load_cache_hit:
    description: "Cache hit from the restore SBT job (should be the cache_hit output from the restore SBT job)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Store SBT cache
      if: ${{ ! fromJson(inputs.load_cache_hit) }}
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ${{ github.repository == 'DACH-NY/canton-network-internal' && '/home/runner/.ivy2/cache' || '/github/home/.ivy2/cache' }}
          ${{ github.repository == 'DACH-NY/canton-network-internal' && '/home/runner/.sbt' || '/github/home/.sbt' }}
        key: ${{ inputs.cache_key }}
    - name: Not storing SBT cache
      if: ${{ fromJson(inputs.load_cache_hit) }}
      shell: bash
      run: |
        echo "Skipping SBT cache, as there was a cache hit"
