name: "Restore frontend node-modules"
description: "Restore the npm install cache"
inputs:
  cache_version:
    description: "Version of the cache"
    required: true
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}
outputs:
  cache_hit:
    description: "Cache hit"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache_key:
    description: "Primary key of the cache. Pass it to the matching save action, so that the cache is saved under the key computed before the job modified any files."
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: "composite"
  steps:
    - name: Restore frontend node_modules
      id: restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: /tmp/npm_install
        key: frontend-npm-install-${{ inputs.cache_version }} dependencies:${{ hashFiles(format('{0}/apps/package-lock.json', inputs.splice_root), format('{0}/token-standard/package-lock.json', inputs.splice_root), format('{0}/openapi-cache-key.txt', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/apps/generated-packages.json', inputs.splice_root)) }} rev:${{ github.sha }}
        # A PR that changes a dependency file starts from the newest node_modules of its base branch; sbt reruns npm ci and
        # the openapi codegen if their inputs changed. Only PRs, see precompiled_classes/restore.
        restore-keys: |
          frontend-npm-install-${{ inputs.cache_version }} dependencies:${{ hashFiles(format('{0}/apps/package-lock.json', inputs.splice_root), format('{0}/token-standard/package-lock.json', inputs.splice_root), format('{0}/openapi-cache-key.txt', inputs.splice_root), format('{0}/project/BuildCommon.scala', inputs.splice_root), format('{0}/apps/generated-packages.json', inputs.splice_root)) }}
          ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && format('frontend-npm-install-{0} dependencies:', inputs.cache_version) || '' }}
    - name: Extracting archive of npm dependencies
      uses: ./.github/actions/nix/run
      with:
        cmd: |
          if [[ -e /tmp/npm_install ]]; then
            tar --use-compress-program=pigz -xf /tmp/npm_install/node_modules.tar.gz
            tar --use-compress-program=pigz -xf /tmp/npm_install/openapi-ts-client.tar.gz
          else
            echo "No npm install cache found. Skipping..."
          fi
