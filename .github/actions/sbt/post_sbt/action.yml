name: "Post SBT job"
description: "Post SBT job"
inputs:
  setup_sbt_cache_hits:
    description: "Restore results from the setup SBT job (should be the cache_hits output from the setup SBT job)"
    required: true
  save_caches:
    description: |
      Set to true only in the single job that is the designated writer of the sbt/classes/npm/Daml caches
      (currently the docs job). Having one writer avoids jobs racing to save partial contents under the same key.
      Even when true, caches are only saved as decided by the "Decide which caches to save" step below.
    required: false
    default: "false"
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}

runs:
  using: 'composite'
  steps:
    - name: Decide which caches to save
      id: policy
      shell: bash
      env:
        SAVE_CACHES: ${{ inputs.save_caches }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # all:     push to main/release-line branches. These caches are shared with all PRs, so only trusted,
        #          merged code may write them.
        # missing: pull_request. GitHub scopes these caches to the PR, so no other run can read them. Only save
        #          when nothing was restored, i.e. when the PR changed the cache dependencies and the base
        #          branch caches don't apply. Otherwise each PR push would upload ~1.5GB that no one needs and
        #          that evicts other caches from the 10GB repo quota.
        # none:    everything else. In particular pull_request_target (PRs from forks), which would write into
        #          the base branch scope, and scheduled/manual runs, which may use a non-default build config.
        mode=none
        if [[ "$SAVE_CACHES" == "true" ]]; then
          case "$EVENT_NAME" in
            push) mode=all ;;
            pull_request) mode=missing ;;
          esac
        fi
        echo "Cache save mode: $mode (save_caches=$SAVE_CACHES, event=$EVENT_NAME)"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"

    - name: Store precompiled classes
      if: ${{ steps.policy.outputs.mode == 'all' || (steps.policy.outputs.mode == 'missing' && fromJson(inputs.setup_sbt_cache_hits).classes.matched_key == '') }}
      uses: ./.github/actions/cache/precompiled_classes/save
      with:
        cache_key: ${{ fromJson(inputs.setup_sbt_cache_hits).classes.key }}
        load_cache_hit: ${{ fromJson(inputs.setup_sbt_cache_hits).classes.hit }}
        splice_root: ${{ inputs.splice_root }}

    - name: Store SBT Cache
      if: ${{ steps.policy.outputs.mode == 'all' || (steps.policy.outputs.mode == 'missing' && fromJson(inputs.setup_sbt_cache_hits).sbt.matched_key == '') }}
      uses: ./.github/actions/cache/sbt/save
      with:
        cache_key: ${{ fromJson(inputs.setup_sbt_cache_hits).sbt.key }}
        load_cache_hit: ${{ fromJson(inputs.setup_sbt_cache_hits).sbt.hit }}
        splice_root: ${{ inputs.splice_root }}

    - name: Store frontend node_modules
      if: ${{ steps.policy.outputs.mode == 'all' || (steps.policy.outputs.mode == 'missing' && fromJson(inputs.setup_sbt_cache_hits).node_modules.matched_key == '') }}
      uses: ./.github/actions/cache/frontend_node_modules/save
      with:
        cache_key: ${{ fromJson(inputs.setup_sbt_cache_hits).node_modules.key }}
        load_cache_hit: ${{ fromJson(inputs.setup_sbt_cache_hits).node_modules.hit }}
        splice_root: ${{ inputs.splice_root }}

    - name: Store Daml artifacts
      if: ${{ steps.policy.outputs.mode == 'all' || (steps.policy.outputs.mode == 'missing' && fromJson(inputs.setup_sbt_cache_hits).daml.matched_key == '') }}
      uses: ./.github/actions/cache/daml_artifacts/save
      with:
        cache_key: ${{ fromJson(inputs.setup_sbt_cache_hits).daml.key }}
        load_cache_hit: ${{ fromJson(inputs.setup_sbt_cache_hits).daml.hit }}
        splice_root: ${{ inputs.splice_root }}

    # The reports are used to split tests across runners, so only store times of
    # passing suites from non-PR runs: a failing PR run would otherwise overwrite
    # them with near-zero times and skew the split for every later run.
    - name: Collect test reports
      if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      shell: bash
      env:
        SPLICE_ROOT: ${{ inputs.splice_root }}
      run: |
        sudo mkdir -p /cache/test-reports
        sudo chown $(whoami):$(whoami) "/cache/test-reports"
        for report in $(find "$SPLICE_ROOT" -path "*/target/test-reports/TEST-*.xml")
        do
          header=$(grep -m1 -oE '<testsuite [^>]*>' "$report" || true)
          if [[ "$header" == *' failures="0"'* && "$header" == *' errors="0"'* && "$header" != *' tests="0"'* ]]; then
            cp -v "$report" /cache/test-reports/
          else
            echo "Not caching $report: ${header:-no testsuite header}"
          fi
        done
