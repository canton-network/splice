name: "Setup SBT test job"
description: "Setup SBT test job"
inputs:
  cache_version:
    description: "Version of the cache"
    required: true
  splice_root:
    description: "Path to splice repo"
    default: ${{ github.repository == 'DACH-NY/canton-network-internal' && 'splice' || '.' }}
  restore_build_outputs:
    description: "Whether to restore the frontend node_modules and the Daml artifacts"
    required: false
    default: "true"
outputs:
  cache_hits:
    description: "Restore results per cache as JSON ({<cache>: {hit, key}}), to be passed to post_sbt"
    value: ${{ steps.cache_hits.outputs.cache_hits }}
runs:
  using: 'composite'
  steps:

    - name: Make sure coursier cache directory exists and is owned by the current user
      shell: bash
      run: |
        sudo mkdir -p "/cache/coursier"
        sudo chown $(whoami):$(whoami) "/cache/coursier"

    - name: Restore precompiled classes
      id: classes
      uses: ./.github/actions/cache/precompiled_classes/restore
      with:
        cache_version: ${{ inputs.cache_version }}
        splice_root: ${{ inputs.splice_root }}

    - name: Restore SBT cache
      id: sbt
      uses: ./.github/actions/cache/sbt/restore
      with:
        cache_version: ${{ inputs.cache_version }}
        splice_root: ${{ inputs.splice_root }}

    - name: Restore frontend node_modules
      if: inputs.restore_build_outputs == 'true'
      id: frontend_node_modules
      uses: ./.github/actions/cache/frontend_node_modules/restore
      with:
        cache_version: ${{ inputs.cache_version }}
        splice_root: ${{ inputs.splice_root }}

    - name: Restore Daml artifacts
      if: inputs.restore_build_outputs == 'true'
      id: daml
      uses: ./.github/actions/cache/daml_artifacts/restore
      with:
        cache_version: ${{ inputs.cache_version }}
        splice_root: ${{ inputs.splice_root }}

    - name: Collect cache hits
      id: cache_hits
      shell: bash
      env:
        CLASSES_HIT: ${{ steps.classes.outputs.cache_hit }}
        CLASSES_KEY: ${{ steps.classes.outputs.cache_key }}
        SBT_HIT: ${{ steps.sbt.outputs.cache_hit }}
        SBT_KEY: ${{ steps.sbt.outputs.cache_key }}
        NODE_MODULES_HIT: ${{ steps.frontend_node_modules.outputs.cache_hit }}
        NODE_MODULES_KEY: ${{ steps.frontend_node_modules.outputs.cache_key }}
        DAML_HIT: ${{ steps.daml.outputs.cache_hit }}
        DAML_KEY: ${{ steps.daml.outputs.cache_key }}
      run: |
        set -euo pipefail
        # Collect the restore results into a json struct that post_sbt uses to decide what to save.
        # The keys are passed along so that post_sbt saves under the key computed here, before the job
        # modified any of the hashed files (recomputing hashFiles at the end of the job produced keys
        # that no later restore ever matched).

        # The keys are built from the cache version, hex hashes and the commit sha only. Refuse anything
        # else, as it would have to be escaped to be embedded into JSON.
        for k in "$CLASSES_KEY" "$SBT_KEY" "$NODE_MODULES_KEY" "$DAML_KEY"; do
          if [[ ! "$k" =~ ^[A-Za-z0-9\ :=._-]*$ ]]; then
            echo "::error::Unexpected characters in cache key: $k"
            exit 1
          fi
        done

        entry() {
          local name="$1" hit="$2" key="$3"
          # Note that when there's a complete miss rather than a hit on an alternative key,
          # the cache-hit output from the cache/restore action is empty and not false.
          [[ "$hit" == "true" ]] || hit=false
          printf '"%s": {"hit": %s, "key": "%s"}' "$name" "$hit" "$key"
        }

        {
          echo -n "cache_hits={"
          entry classes "$CLASSES_HIT" "$CLASSES_KEY"; echo -n ", "
          entry sbt "$SBT_HIT" "$SBT_KEY"; echo -n ", "
          entry node_modules "$NODE_MODULES_HIT" "$NODE_MODULES_KEY"; echo -n ", "
          entry daml "$DAML_HIT" "$DAML_KEY"
          echo "}"
        } >> "$GITHUB_OUTPUT"
