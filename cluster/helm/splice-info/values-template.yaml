nginxImage: nginxinc/nginx-unprivileged:1.31.6-alpine-slim@sha256:ac4d9c7e457c6510b95ac72dd84b27f7cc68ecb9a83fbd44f05a6460cf08aba4
updaterImage: registry.gitlab.com/gitlab-ci-utils/curl-jq:5.0.3@sha256:eaf99ecea8b7e4fbbe161db8ba6fa2099a1d53b4e108926492d3c6577135b1f0
contentType: "application/json"

# runtimeDetails:  # Optional, exposes the runtime configuration under path /runtime/
#   synchronizerSerialId: 5  # Serial ID of the current synchronizer to fetch metrics
#   scanUrl: https://scan.sv.global.canton.network.xxx  # Optional, the default is the internal scan address, it's used to fetch the runtime configuration
#   tlsSkipVerify: true  # Optional, the default is false

# deploymentDetails:  # Optional, exposes static configuration under path /
#   network: "dev"
#   configDigest:
#     allowedIpRanges:
#       type: "md5"
#       value: "AAA"
#     approvedSvIdentities:
#       type: "sha256"
#       value: "BBB"
#   sv:
#     version: "0.3.3"  # Optional, the default is set to the Chart version
#   synchronizer:
#     current:
#       chainIdSuffix: "id0"
#       migrationId: 4
#       synchronizerSerialId: 5
#       version: "0.3.3"  # Optional, the default is set to the Chart version
#     successor:
#       chainIdSuffix: "id1"
#       migrationId: 4
#       synchronizerSerialId: 6
#       version: "0.3.4"
#     legacy: null

# istioVirtualService:  # Optional, configures Istio VirtualService for routing
#   host: "info.example.com"
#   gateway: "istio-gateway-example"

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: "0"
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}

securityContexts:
  pod:
    security_context_profile: pod_security_context
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
  containers:
    nginx:
      security_context_profile: app_security_context
    updater:
      security_context_profile: app_security_context

