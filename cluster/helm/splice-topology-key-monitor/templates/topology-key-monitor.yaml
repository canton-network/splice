apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- $annotations := include "splice-util-lib.default-annotations" .Values }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "splice-util-lib.default-labels" (set . "app" .Release.Name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "splice-util-lib.default-labels" (set . "app" .Release.Name) | nindent 8 }}
      {{- with .Values.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "splice-util-lib.service-account" .Values | nindent 6 }}
      {{- if .Values.securityContexts }}
      {{- with .Values.securityContexts.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: topology-key-monitor
          {{- if .Values.securityContexts }}
          {{- with .Values.securityContexts.containers.topologyKeyMonitor }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          image: {{ .Values.imageRepo }}/{{ .Values.imageName }}:{{ .Chart.AppVersion }}{{ ((.Values.imageDigests).canton) }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command:
            - /app/bin/canton
            - run
            - --no-tty
            - --log-encoder=json
            - --log-file-appender=off
            - --log-level-stdout=INFO
            - --config
            - /app/topology-key-monitor/app.conf
            - /app/topology-key-monitor/topology-key-monitor.sc
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "{{ .Values.defaultJvmOptions }} {{ .Values.additionalJvmOptions }}"
            - name: TOPOLOGY_KEY_MONITOR_KEYS
              value: {{ join "," .Values.keys | quote }}
            - name: TOPOLOGY_KEY_MONITOR_EXPECTED_SYNCHRONIZER_ALIASES
              value: {{ join "," .Values.expectedSynchronizerAliases | quote }}
            - name: TOPOLOGY_KEY_MONITOR_POLL_INTERVAL
              value: {{ .Values.pollIntervalSeconds | quote }}
            - name: TOPOLOGY_KEY_MONITOR_SLOW_QUERY_THRESHOLD
              value: {{ .Values.slowQueryThresholdSeconds | quote }}
          volumeMounts:
            - name: topology-key-monitor-config
              mountPath: /app/topology-key-monitor
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: topology-key-monitor-config
          configMap:
            name: {{ .Release.Name }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splice-util-lib.default-labels" (set . "app" .Release.Name) | nindent 4 }}
data:
  app.conf: |
    canton.remote-participants.participant {
      admin-api {
        address = {{ .Values.participant.address | quote }}
        port = {{ .Values.participant.adminApiPort }}
      }
      ledger-api {
        address = {{ .Values.participant.address | quote }}
        port = {{ .Values.participant.ledgerApiPort }}
      }
    }
  topology-key-monitor.sc: |
{{ .Files.Get "files/topology-key-monitor.sc" | indent 4 }}
