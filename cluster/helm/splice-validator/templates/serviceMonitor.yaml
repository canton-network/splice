{{- $validatorAppLabel := .Values.appLabels.validatorApp | default "validator-app" }}
{{- if .Values.metrics.enable }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: {{ .Values.metrics.release }}
  name: {{ .Values.appLabels.validatorApp | default "validator" }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:

  - port: metrics
    interval: {{ .Values.metrics.interval }}

  selector:
    matchLabels:
      app: {{ $validatorAppLabel }}

  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}

{{- end }}
