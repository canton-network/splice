# Configurations here will be applied after app.conf, and before any ADDITIONAL_CONFIG env vars
# Please use this file for temporary changes that require quick iterations. Always add a TO-DO
# issue when adding things here and either alert an upstream team to upstream your changes
# or open PRs to upstream yourself.

# TODO(DACH-NY/canton-network-internal#7687): Upstream this
canton.features.enable-preview-commands = no
# TODO(#4879): Remove once participant auto-init is
# upstreamed into the canton-participant image's app.conf.
canton.participants.participant.init {
  generate-topology-transactions-and-keys = true
  identity.type = auto
  identity.identifier.type = explicit
  identity.identifier.name = ${CANTON_PARTICIPANT_IDENTIFIER}
}

# TODO(DACH-NY/canton-network-internal#8285): upstream admin API auth config
_default_admin_api_user_allowed_services = [
  "com.digitalasset.canton.admin.participant.v30.PackageService",
  "com.digitalasset.canton.admin.participant.v30.ParticipantRepairService",
  "com.digitalasset.canton.admin.participant.v30.ParticipantStatusService",
  "com.digitalasset.canton.admin.participant.v30.PartyManagementService",
  "com.digitalasset.canton.admin.participant.v30.PruningService",
  "com.digitalasset.canton.admin.participant.v30.SynchronizerConnectivityService",
  "com.digitalasset.canton.admin.participant.v30.TrafficControlService",
  "com.digitalasset.canton.connection.v30.ApiInfoService",
  "com.digitalasset.canton.crypto.admin.v30.VaultService",
  "com.digitalasset.canton.time.admin.v30.SynchronizerTimeService",
  "com.digitalasset.canton.topology.admin.v30.IdentityInitializationService",
  "com.digitalasset.canton.topology.admin.v30.TopologyAggregationService",
  "com.digitalasset.canton.topology.admin.v30.TopologyManagerReadService",
  "com.digitalasset.canton.topology.admin.v30.TopologyManagerWriteService",
]
_admin_api_users = [
  {
    user-id = ${?SPLICE_PARTICIPANT_ADMIN_API_USER}
    allowed-services = ${_default_admin_api_user_allowed_services}
  },
]
_admin_api_auth_service = {
  type = jwt-jwks
  url = ${?SPLICE_PARTICIPANT_ADMIN_API_JWKS_URL}
  target-audience = ${?SPLICE_PARTICIPANT_ADMIN_API_TARGET_AUDIENCE}
  users = ${_admin_api_users}
}
canton.participants.participant.admin-api {
  auth-services = [${_admin_api_auth_service}]
}
