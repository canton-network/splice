# Configurations here will be applied after app.conf, and before any ADDITIONAL_CONFIG env vars
# Please use this file for temporary changes that require quick iterations. Always add a TO-DO
# issue when adding things here and either alert an upstream team to upstream your changes
# or open PRs to upstream yourself.

# TODO(DACH-NY/canton-network-internal#7687): Upstream this
canton.features.enable-preview-commands = no
# TODO(DACH-NY/splice#4879): Remove once participant auto-init is
# upstreamed into the canton-participant image's app.conf.
canton.participants.participant.init {
  generate-topology-transactions-and-keys = true
  identity.type = auto
  identity.identifier.type = explicit
  identity.identifier.name = "participant"
  identity.identifier.name = ${?CANTON_PARTICIPANT_IDENTIFIER}
}

# TODO(DACH-NY/canton-network-internal#7687): Remove this - we want this disabled as by the upstream default
canton.features.enable-repair-commands = yes
