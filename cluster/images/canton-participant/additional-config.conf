# Disallow downloading private keys via the admin API by default; operators re-enable it if needed
# (e.g., for participant identities backups of non-KMS participants).
# On participants, this flag only gates `VaultService/ExportKeyPair` server-side.
# TODO(DACH-NY/canton-network-internal#7687): Upstream this, and switch to the dedicated `enable-key-download` flag once available.
canton.features.enable-preview-commands = no
