# Configurations here will be applied after app.conf, and before any ADDITIONAL_CONFIG env vars
# Please use this file for temporary changes that require quick iterations. Once made permanent,
# please upstream the change to the Canton repo.

# TODO(DACH-NY/canton-network-internal#7027) Clean up once upstreamed
canton.sequencers.sequencer {
  topology {
    enable-topology-state-cache-consistency-checks = false
    use-new-processor = true
    use-new-client = true
  }
  sequencer {
    config.consensus-empty-block-creation-timeout = 500.milliseconds
    config.output-fetch-how-many-recipients = 2
    block.throughput-cap.messages {
      confirmation-request.strict = false
      topology.strict = false
    }
  }
}
