apiVersion: 1
groups:
  - orgId: 1
    name: splice-rate-limiting
    folder: platform
    interval: 5m
    rules:
      - uid: cfvmu2hs596v4d
        title: Splice Rate Limiting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                max by (namespace, node_name, http_service, limiter, limiter_type) (
                  splice_rate_limiting_max_limit_per_second
                )
                -
                sum by (namespace, node_name, http_service, limiter, limiter_type) (
                  rate(splice_rate_limiting_total[$__rate_interval])
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: Incoming request rate for this limiter has exceeded its configured splice_rate_limiting_max_limit_per_second for 5 minutes.
          summary: Rate limiter "{{ $labels.limiter }}" on {{ $labels.node_name }} ({{ $labels.http_service }}) in {{ $labels.namespace }} is receiving more requests than its configured limit allows.
        labels:
          "": ""
          gcloud_filter: resource.labels.namespace_name=%22cluster-ingress%22%0AjsonPayload.response_code=429
        isPaused: false
