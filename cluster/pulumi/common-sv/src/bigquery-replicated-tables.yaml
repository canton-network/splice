# Scan tables replicated to BigQuery, read by bigQuery.ts. The
# publications, both Datastreams and the scheduled queries all follow
# this file.
#
# since: replicate the table, or copy the column to production, only
# once scanApp.bigQuery.flywayMigrationToWaitFor is at least this
# migration, which must be one of those allowed there. Use the first
# allowed migration at or after the one that adds the table or column.
#
# columns: the Postgres columns copied to production;
# datastream_metadata is added by bigQuery.ts.
# - When Postgres adds a column, list it here with a `since`, or it is
#   not copied to production. DbScanStoreTest checks that every column
#   in scan's database is listed.
# - Avoid dropping a replicated column in Postgres: Datastream lists
#   that among the schema changes that may corrupt data ("Known
#   limitations" in
#   https://docs.cloud.google.com/datastream/docs/sources-postgresql).
#   Once a column is dropped, neither choice here is safe. While it
#   is listed, the append fails on a staging table created after the
#   drop, which lacks the column. Removing it here stops copying it on
#   every deployment at once, including those whose Postgres still has
#   it. TODO (#8343) remove columns from a migration on, as `since`
#   adds them, e.g. with `removed: <migration>`.
#
# appendMode: how the hourly scheduled query appends staging rows to
# production:
# - watermark: rows up to an hour before the newest staging row, past
#   a watermark (hourly_append.sql); for tables written continuously
# - newKeys: every row whose single-column primaryKey isn't in
#   production yet (append_new_keys.sql); for insert-only tables
#   written in bursts, whose last hour the watermark would leave in
#   staging until the next burst
update_history_creates:
  primaryKey: row_id
  datePartitionColumn: record_time
  timeType: micros
  appendMode: watermark
  columns:
    - history_id
    - row_id
    - ingested_at
    - event_id
    - update_row_id
    - contract_id
    - created_at
    - template_id_package_id
    - template_id_module_name
    - template_id_entity_name
    - package_name
    - create_arguments
    - signatories
    - observers
    - contract_key
    - record_time
    - update_id
    - domain_id
    - migration_id
    - name: template_id_package_id_interned
      since: V085__partition_update_history.sql
    - name: template_id_module_name_interned
      since: V085__partition_update_history.sql
    - name: template_id_entity_name_interned
      since: V085__partition_update_history.sql
    - name: package_name_interned
      since: V085__partition_update_history.sql
update_history_exercises:
  primaryKey: row_id
  datePartitionColumn: record_time
  timeType: micros
  appendMode: watermark
  columns:
    - history_id
    - row_id
    - ingested_at
    - event_id
    - update_row_id
    - child_event_ids
    - choice
    - template_id_package_id
    - template_id_module_name
    - template_id_entity_name
    - contract_id
    - consuming
    - argument
    - result
    - package_name
    - interface_id_package_id
    - interface_id_module_name
    - interface_id_entity_name
    - acting_parties
    - record_time
    - update_id
    - domain_id
    - migration_id
    - name: template_id_package_id_interned
      since: V085__partition_update_history.sql
    - name: template_id_module_name_interned
      since: V085__partition_update_history.sql
    - name: template_id_entity_name_interned
      since: V085__partition_update_history.sql
    - name: package_name_interned
      since: V085__partition_update_history.sql
    - name: choice_interned
      since: V085__partition_update_history.sql
    - name: interface_id_package_id_interned
      since: V085__partition_update_history.sql
    - name: interface_id_module_name_interned
      since: V085__partition_update_history.sql
    - name: interface_id_entity_name_interned
      since: V085__partition_update_history.sql
scan_verdict_store:
  primaryKey: row_id
  datePartitionColumn: record_time
  timeType: micros
  appendMode: watermark
  columns:
    - row_id
    - ingested_at
    - migration_id
    - domain_id
    - record_time
    - finalization_time
    - submitting_participant_uid
    - verdict_result
    - mediator_group
    - update_id
    - submitting_parties
    - transaction_root_views
    - history_id
    - total_traffic_cost
    - envelope_traffic_costs
    - name: round_number
      since: V077__verdict_add_round_number.sql
scan_verdict_transaction_view_store:
  primaryKey: verdict_row_id, view_id
  datePartitionColumn: source_timestamp
  timeType: datastream_metadata
  appendMode: watermark
  columns:
    - verdict_row_id
    - view_id
    - informees
    - confirming_parties
    - sub_views
app_activity_record_store:
  primaryKey: verdict_row_id
  datePartitionColumn: source_timestamp
  timeType: datastream_metadata
  appendMode: watermark
  columns:
    - history_id
    - verdict_row_id
    - round_number
    - app_provider_parties
    - app_activity_weights
    - name: submitting_app_provider
      since: V082__tbar_v1_1_asset_activity_columns.sql
    - name: asset_activity_provider_parties
      since: V082__tbar_v1_1_asset_activity_columns.sql
    - name: asset_activity_weights
      since: V082__tbar_v1_1_asset_activity_columns.sql
interned_strings:
  since: V074__string_interning.sql
  primaryKey: id
  datePartitionColumn: source_timestamp
  timeType: datastream_metadata
  # new strings arrive in bursts, e.g. on package upgrades, and are
  # never changed
  appendMode: newKeys
  columns:
    - id
    - value
