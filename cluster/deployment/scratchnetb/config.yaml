!include($SPLICE_ROOT/cluster/configs/shared/scratchnet.yaml)
infra:
  gkeGateway:
    # required for Cloud Armor to be attached to anything
    proxyForIstioHttp: true
cloudArmor:
  enabled: true
  enableAdaptiveProtection: true
  # start in preview mode: rules are evaluated and logged but not enforced.
  # flip to false to actually enforce the allow list and the default deny.
  allRulesPreviewOnly: false
