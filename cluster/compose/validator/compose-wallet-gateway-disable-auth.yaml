configs:
  wallet-gateway-config:
    content: |
      {
        "kernel": {
          "id": "splice-compose-validator",
          "clientType": "remote",
          "publicUrl": "http://walletgateway.localhost"
        },
        "server": {
          "port": 3030,
          "allowedOrigins": ["http://portfolio.localhost"],
          "dappPath": "/api/v0/dapp",
          "userPath": "/api/v0/user",
          "requestSizeLimit": "5mb",
          "requestRateLimit": 10000,
          "trustProxy": 1,
          "signingWorker": { "pollInterval": 5000 }
        },
        "store": {
          "connection": {
            "type": "postgres",
            "host": "${SPLICE_DB_SERVER}",
            "port": ${SPLICE_DB_PORT},
            "user": "${SPLICE_DB_USER}",
            "passwordEnv": "WG_STORE_PASSWORD",
            "database": "wallet_gateway_store_disable_auth"
          }
        },
        "signingStore": {
          "connection": {
            "type": "postgres",
            "host": "${SPLICE_DB_SERVER}",
            "port": ${SPLICE_DB_PORT},
            "user": "${SPLICE_DB_USER}",
            "passwordEnv": "WG_STORE_PASSWORD",
            "database": "wallet_gateway_signing_store_disable_auth"
          }
        },
        "bootstrap": {
          "idps": [
            {
              "id": "idp-self-signed",
              "type": "self_signed",
              "issuer": "self-signed"
            }
          ],
          "networks": [
            {
              "id": "canton:splice-compose-validator",
              "name": "Splice validator",
              "description": "Docker Compose validator (no authentication)",
              "identityProviderId": "idp-self-signed",
              "ledgerApi": { "baseUrl": "http://participant:7575" },
              "auth": {
                "method": "self_signed",
                "issuer": "self-signed",
                "audience": "${VALIDATOR_AUTH_AUDIENCE}",
                "scope": "daml_ledger_api",
                "clientId": "wallet-user",
                "clientSecret": "unsafe"
              },
              "adminAuth": {
                "method": "self_signed",
                "issuer": "self-signed",
                "audience": "${VALIDATOR_AUTH_AUDIENCE}",
                "scope": "daml_ledger_api",
                "clientId": "ledger-api-user",
                "clientSecret": "unsafe"
              }
            }
          ]
        }
      }

services:
  # The gateway only bootstraps its IdPs and networks into an empty store, so switching auth modes on
  # an existing deployment needs a store of its own
  postgres-splice:
    environment:
      - CREATE_DATABASE_wallet_gateway_store_disable_auth=wallet_gateway_store_disable_auth
      - CREATE_DATABASE_wallet_gateway_signing_store_disable_auth=wallet_gateway_signing_store_disable_auth
