# Virtual hosts for the Wallet Gateway and the Portfolio UI, mounted by compose-wallet-gateway.yaml.
server {
  listen 80;
  server_name walletgateway.localhost;
  location / {
    proxy_pass http://wallet-gateway:3030;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name portfolio.localhost;
  location / {
    proxy_pass http://portfolio:80;
  }
}
