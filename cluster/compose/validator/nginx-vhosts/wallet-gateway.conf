# Virtual hosts for the Wallet Gateway and the Portfolio UI, mounted by compose-wallet-gateway.yaml.
server {
  listen 80;
  server_name walletgateway.localhost;
  resolver 127.0.0.11 valid=10s;
  location / {
    set $wallet_gateway http://wallet-gateway:3030;
    proxy_pass $wallet_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name portfolio.localhost;
  resolver 127.0.0.11 valid=10s;
  location / {
    set $portfolio http://portfolio:80;
    proxy_pass $portfolio;
  }
}
