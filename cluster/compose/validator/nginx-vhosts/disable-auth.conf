map $http_origin $origin_allowed {
  default 0;
  # Requests without an Origin header, e.g. from non-browser clients
  "" 1;
  "http://wallet.localhost" 1;
  "http://ans.localhost" 1;
  "http://portfolio.localhost" 1;
}

# Close the connection for requests whose Host matches none of the configured virtual hosts
server {
  listen 8080 default_server;
  server_name _;
  return 444;
}
