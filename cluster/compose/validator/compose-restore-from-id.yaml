services:

  participant:
    environment:
      # Importing the ACS of the migrated parties requires the participant's repair service
      - ADDITIONAL_CONFIG_ENABLE_REPAIR_COMMANDS=canton.features.enable-repair-commands = yes
      # The identity comes from the dump, so Canton must not create one first.
      # `identity = null` is required: HOCON merges objects on duplicate keys,
      # so without it the auto-init `identity.identifier` would survive and
      # Canton rejects it, since `manual` takes no identifier.
      - |
        ADDITIONAL_CONFIG_MANUAL_INIT=
          canton.participants.participant.init.identity = null
          canton.participants.participant.init.identity = { type = manual }
          canton.participants.participant.init.generate-topology-transactions-and-keys = false

  chown-participant-bootstrapping-dump:
    image: busybox:1.37.0
    volumes:
      - ${VALIDATOR_PARTICIPANT_IDENTITIES_DUMP}:/participant-bootstrapping-dump/identities.json
    command: ["sh", "-c", "chown 1001:1001 /participant-bootstrapping-dump/identities.json"]

  validator:
    environment:
        - |
          ADDITIONAL_CONFIG_SPLICE_APP_VALIDATOR_PARTICIPANT_IDENTITIES_DUMP_IMPORT=
            canton.validator-apps.validator_backend.participant-bootstrapping-dump {
              type = file
              file = /participant-bootstrapping-dump/identities.json
              new-participant-identifier = ${VALIDATOR_NEW_PARTICIPANT_IDENTIFIER}
            }
        - |
          ADDITIONAL_CONFIG_MIGRATE_VALIDATOR_PARTY=
            canton.validator-apps.validator_backend.migrate-validator-party.scan.admin-api.url = "${SCAN_ADDRESS}"
    volumes:
      - ${VALIDATOR_PARTICIPANT_IDENTITIES_DUMP}:/participant-bootstrapping-dump/identities.json
    depends_on:
      chown-participant-bootstrapping-dump:
        condition: service_completed_successfully

