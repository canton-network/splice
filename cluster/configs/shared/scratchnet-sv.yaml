    limits:
      cpu: "3"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi

scanApp:
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: "2"
      memory: 2Gi
participant:
  resources:
