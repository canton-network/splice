globalLimits:
  maxTokens: 200000
  tokensPerFill: 200000
  fillInterval: 60s
globalPerIpLimits:
  maxTokens: 10000
  tokensPerFill: 10000
  fillInterval: 60s
rateLimits:
  # Cheap, infrequent handshake/version negotiation calls.
  /com.digitalasset.canton.sequencer.api.v30.SequencerConnectService/:
    name: sequencer-connect
    type: limited
    maxTokens: 10000
    tokensPerFill: 10000
    fillInterval: 60s
    perIpLimits:
      maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s

  # Token challenge/refresh. Tokens are long lived, so clients hit this rarely.
  /com.digitalasset.canton.sequencer.api.v30.SequencerAuthenticationService/:
    name: sequencer-authentication
    type: limited
    maxTokens: 10000
    tokensPerFill: 10000
    fillInterval: 60s
    perIpLimits:
      maxTokens: 10
      tokensPerFill: 10
      fillInterval: 60s

  # Subscriptions are long lived streams; only opening one consumes a token.
  /com.digitalasset.canton.sequencer.api.v30.SequencerService/Subscribe:
    name: sequencer-subscribe
    type: limited
    maxTokens: 10000
    tokensPerFill: 10000
    fillInterval: 60s
    perIpLimits:
      maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s

  # Onboarding only. Also covers DownloadTopologyStateForInitHash.
  /com.digitalasset.canton.sequencer.api.v30.SequencerService/DownloadTopologyStateForInit:
    name: sequencer-download-topology-state-for-init
    type: limited
    maxTokens: 600
    tokensPerFill: 600
    fillInterval: 60s
    perIpLimits:
      maxTokens: 20
      tokensPerFill: 20
      fillInterval: 60s
