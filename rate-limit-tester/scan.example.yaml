# Scan rate limits, i.e. the defaults from `cluster/configs/shared/base.yaml`.
# Only the global buckets below are under test; the load is driven against `/api/scan/version`,
# which has no bucket of its own and is therefore charged against the global and the global
# per-IP bucket only. Override the probe path with `-e PROBE_PATH=`.
#
#   k6 run src/main.ts \
#     -e DOMAIN=<domain> \
#     -e CONFIG=scan.example.yaml

sv:
  scan:
    externalRateLimits:
      globalLimits:
        maxTokens: 60000
        tokensPerFill: 10000
        fillInterval: "10s"
      globalPerIpLimits:
        maxTokens: 6000
        tokensPerFill: 1000
        fillInterval: "10s"
