openapi: 3.0.0
info:
  title: Credential registry read-only API
  description: |
    Read-only HTTP API for credential registries.
    Registries SHOULD implement this API.
    It covers registry info, credential lookup, and bulk credential retrieval.
    Creating and updating records is a separate, optional API.
  version: 1.0.0
paths:

  /credential-registry/v1/info:
    get:
      operationId: "getCredentialRegistryInfo"
      description: |
        Get information about the credential registry.
        Useful to discover the admin party and the supported versions of the credential registry standard.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetCredentialRegistryInfoResponse"
        "404":
          $ref: "#/components/responses/404"

  /credential-registry/v1/credentials:
    get:
      operationId: "listCredentials"
      description: |
        List the credential records matching the provided filters.

        property is required. issuer, holder, and subject are optional and must be set in that order. A later filter without the earlier ones is rejected with 400.

        Results are ordered by recordTime descending, then by contractId ascending. The operation MAY return records whose expiresAt is in the past. Clients ignore expiresAt when choosing a record and use validFrom and validUntil. Two records are duplicates when they have the same issuer and holder and both contain a claim with the same subject and property. When property, issuer, holder, and subject are set and effectiveOnly is true, the first returned record is the last-write-wins record. Otherwise the client takes, in each group of duplicates, the first returned record whose validity period is effective.

        Note that registries MAY decide to limit the number of records returned.
      parameters:
        - in: query
          name: property
          schema:
            type: string
          required: true
          description: |
            Only return credential records that contain at least one claim with this property.
            The value matches the whole property, not a prefix.
        - in: query
          name: issuer
          schema:
            type: string
          required: false
          description: |
            Only return credential records issued by the specified party.
            Requires property.
        - in: query
          name: holder
          schema:
            type: string
          required: false
          description: |
            Only return credential records held by the specified party.
            Requires property and issuer.
        - in: query
          name: subject
          schema:
            type: string
          required: false
          description: |
            Only return credential records that contain a claim with this subject.
            Requires property, issuer, and holder.
            A claim matches when its subject equals this value, or when its subject is unset and this value is the textual party id of the holder.
        - in: query
          name: effectiveOnly
          schema:
            type: boolean
            default: false
          required: false
          description: |
            If true, return only records whose validity period covers the time the query is served.
            validFrom, if set, is at or before that time. validUntil, if set, is after it.
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
          required: false
          description: |
            The maximum number of credential records to return.
        - in: query
          name: pageToken
          schema:
            type: string
          required: false
          description: |
            The page token to continue retrieving results from a previous list request.
            Ensure that the other filter parameters are identical to the previous request.
        - in: query
          name: includeDisclosedContracts
          schema:
            type: boolean
            default: false
          required: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        - in: query
          name: excludeDebugFields
          schema:
            type: boolean
            default: false
          required: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.

      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

  /credential-registry/v1/synchronizers:
    get:
      operationId: "listCredentialSynchronizers"
      description: Synchronizer ids on which this registry stores credential records.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialSynchronizersResponse"
        "404":
          $ref: "#/components/responses/404"

  /credential-registry/v1/events:
    get:
      operationId: "listCredentialEvents"
      description: |
        Create and archive events for one synchronizer.
        Ordered by recordTime ascending, then contractId ascending.
        A reassignment of a credential contract to another synchronizer is served as an archive event on the source synchronizer and a create event on the target synchronizer.
        Clients persist the events of each response together with its nextPageToken, and continue with that
        token, also after a restart. A response without events means that the client has caught up and should
        retry later with the same token.
        The registry MAY prune the events of records whose archive event is older than the retention window advertised by the Info API in limits.eventRetentionDays. If it pruned
        events later than the position of a pageToken, it responds with 400 instead of skipping them, and the
        client starts over. A client that has caught up and resumes within that window is never rejected.
      parameters:
        - in: query
          name: synchronizerId
          schema:
            type: string
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
          required: false
        - in: query
          name: pageToken
          schema:
            type: string
          required: false
          description: |
            The nextPageToken of a previous response for the same synchronizerId.
            Omit to start from the beginning.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialEventsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

components:
  responses:
    "400":
      description: "bad request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "404":
      description: "not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GetCredentialRegistryInfoResponse:
      type: object
      properties:
        adminId:
          description: "The Daml party of the credential registry administrator"
          type: string
        supportedVersions:
          description: "The versions of the credential registry standard supported by this registry"
          type: array
          items:
            type: integer
            format: int32
        limits:
          $ref: "#/components/schemas/CredentialRegistryLimits"
      required:
        - adminId
        - supportedVersions
        - limits

    CredentialRegistryLimits:
      type: object
      description: "The limits of the credential registry"
      properties:
        maxPageSize:
          description: "The maximum page size supported by the registry for listing credential records"
          type: integer
          format: int32
        maxNumClaims:
          description: |
            The maximum number of claims allowed in new credential records.
            There is no limit on the number of claims when querying existing records.
          type: integer
          format: int32
        maxPropertyLength:
          description: |
            The maximum length of a property allowed in new credential records.
            There is no limit on the property length when querying existing records.
          type: integer
          format: int32
        maxSubjectLength:
          description: |
            The maximum length of the subject field allowed in new credential records.
            There is no limit on the subject field length when querying existing records.
          type: integer
          format: int32
        maxValueLength:
          description: |
            The maximum length of a claim value allowed in new credential records.
            There is no limit on the claim value length when querying existing records.
          type: integer
          format: int32
        eventRetentionDays:
          description: |
            How many days the registry retains events of archived credential records.
            Events whose archive is older than this window MAY be pruned.
          type: integer
          format: int32
      required:
        - maxPageSize
        - maxNumClaims
        - maxPropertyLength
        - maxSubjectLength
        - maxValueLength
        - eventRetentionDays

    ListCredentialsResponse:
      type: object
      description: "The response for listing credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The list of credential records matching the provided filters.
        nextPageToken:
          type: string
          description: |
            The token for the next page of results. Omitted if there are no more results.

    ListCredentialSynchronizersResponse:
      type: object
      properties:
        synchronizerIds:
          type: array
          items:
            type: string
      required:
        - synchronizerIds

    CredentialEvent:
      type: object
      properties:
        eventType:
          type: string
          enum:
            - create
            - archive
        recordTime:
          type: string
          format: date-time
        contractId:
          type: string
        credentialView:
          type: object
          description: Present when eventType is create. Schema of Splice.Api.Credential.RegistryV1.CredentialView.
      required:
        - eventType
        - recordTime
        - contractId

    ListCredentialEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/CredentialEvent"
        nextPageToken:
          type: string
          description: Also present when events is empty.
      required:
        - events
        - nextPageToken

    Credential:
      type: object
      description: |
        A credential record stored in the registry.
      properties:
        contractId:
          type: string
          description: The contract id of the credential record.
        recordTime:
          type: string
          format: date-time
          description: |
            Sequencing time of the confirmation request that created this credential contract.
            Not CredentialView.createdAt.
        credentialView:
          type: object
          description: |
            The view computed for the credential with the schema of Splice.Api.Credential.RegistryV1.CredentialView.
        disclosedContract:
          $ref: "#/components/schemas/DisclosedContract"
          description: |
            The disclosed contract information for verifying the credential record using explicit contract disclosure.
      required:
        [
          "contractId",
          "recordTime",
          "credentialView",
        ]

    DisclosedContract:
      type: object
      description: |
        A contract that is disclosed for use with explicit contract disclosure
        when preparing transactions on validator nodes that do not know this contract.
      properties:
        templateId:
          type: string
          description: "The template ID of the disclosed contract."
        contractId:
          type: string
          description: "The contract ID of the disclosed contract."
        createdEventBlob:
          type: string
          description: |
            The binary-encoded created event of the disclosed contract.
            This blob can be used to prepare transactions on validator
            nodes that do not know this contract. This is done using
            explicit contract disclosure, where the created event is
            provided alongside the command that refers to the contract.
        synchronizerId:
          description: |
            The synchronizer to which the contract is currently assigned.
            If the contract is in the process of being reassigned, then a "409" response is returned.
          type: string
        debugPackageName:
          description: |
            The name of the Daml package that was used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
        debugPayload:
          description: |
            The contract arguments that were used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: object
        debugCreatedAt:
          description: |
            The ledger effective time at which the contract was created.
            Use this data only if you trust the provider, as it might not match the data in the
            `disclosedContract`.
          type: string
          format: date-time
      required:
        [
          "templateId",
          "contractId",
          "createdEventBlob",
          "synchronizerId"
        ]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
