openapi: 3.0.0
info:
  title: Credential registry query API
  description: |
    Read-only HTTP API for querying the credential records of a credential registry.
    Registries SHOULD implement it.
    Record schema: Daml package `splice-api-credential-record-v1`.
  version: 1.0.0
paths:

  /registry/credential-query/v1/info:
    get:
      operationId: "getCredentialRegistryInfo"
      description: |
        Get information about the credential registry.
        Useful to discover the admin party and the supported versions of the credential registry standard.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetCredentialRegistryInfoResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/credentials:
    post:
      operationId: "listCredentials"
      description: |
        List the credential records matching the filters.
        `property` is required; `issuer`, `holder`, and `subject` are optional and set in that order.

        Results are computed at `synchronizerTimes`, and ordered by `synchronizerId`,
        then `recordTime` descending, then `contractId`.
        With all four filters and `effectiveOnly`, the first record per synchronizer is the last-write-wins record.

        Continue with `next` as `after`. A page holds `min(limit, limits.maxPageSize)` records, except the last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCredentialsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

  /registry/credential-query/v1/credentials/snapshot:
    post:
      operationId: "listCredentialsSnapshot"
      description: |
        List all active credential records, computed at `synchronizerTimes` and ordered by `contractId`.
        A record being reassigned is not included; its create event on the target synchronizer follows in `/events`.

        Continue with `next` as `after` and the same `synchronizerTimes`. A page holds `min(limit, limits.maxPageSize)` records, except the last.
        Then read `/events` after the response's `synchronizerTimes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCredentialsSnapshotRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsSnapshotResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

  /registry/credential-query/v1/credentials/lookup:
    post:
      operationId: "lookupCredential"
      description: |
        Look up a credential record by `contractId`, computed at `synchronizerTimes`.

        `status` is `active` or `archived`. A record being reassigned stays `active`, without a `DisclosedContract`.
        Responds with 404 if the record is not found, or was archived more than `limits.eventRetentionDays` ago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupCredentialRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupCredentialResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

  /registry/credential-query/v1/synchronizers:
    get:
      operationId: "listCredentialSynchronizers"
      description: |
        The synchronizers that hold credential records, each with the latest record time the registry has fully processed on it.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialSynchronizersResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/events:
    get:
      operationId: "listCredentialEvents"
      description: |
        Create and archive events of one synchronizer, ordered by `recordTime`, then `contractId`.
        Events with the same `recordTime` and `contractId` stay on one page.
        A reassignment is an archive on the source and a create on the target.

        Resume with `afterRecordTime` and `afterContractId` of the last processed event,
        or with `afterRecordTime` only after a snapshot. An empty response means the client has caught up.

        Events of records archived more than `limits.eventRetentionDays` ago MAY be pruned.
        If events after the given position were pruned, this responds with 400; restart from a snapshot.
      parameters:
        - in: query
          name: synchronizerId
          schema:
            type: string
          required: true
        - in: query
          name: limit
          description: "The maximum number of events to return, at most `limits.maxPageSize`."
          schema:
            type: integer
            format: int32
          required: false
        - in: query
          name: afterRecordTime
          schema:
            type: string
            format: date-time
          required: false
        - in: query
          name: afterContractId
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialEventsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

components:
  responses:
    "400":
      description: "bad request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "404":
      description: "not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "503":
      description: |
        The registry has not yet processed the requested synchronizerTimes.
        Retry later, or against another backend of the registry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GetCredentialRegistryInfoResponse:
      type: object
      properties:
        adminId:
          description: "The Daml party of the credential registry administrator"
          type: string
        supportedVersions:
          description: "The versions of the credential registry standard supported by this registry"
          type: array
          items:
            type: integer
            format: int32
        limits:
          $ref: "#/components/schemas/CredentialRegistryLimits"
      required:
        - adminId
        - supportedVersions
        - limits

    CredentialRegistryLimits:
      type: object
      description: "The limits of the credential registry"
      properties:
        maxPageSize:
          description: "The maximum page size supported by the registry for listing credential records"
          type: integer
          format: int32
        maxNumClaims:
          description: |
            The maximum number of claims allowed in new credential records.
            There is no limit on the number of claims when querying existing records.
          type: integer
          format: int32
        maxPropertyLength:
          description: |
            The maximum length of a property allowed in new credential records.
            There is no limit on the property length when querying existing records.
          type: integer
          format: int32
        maxSubjectLength:
          description: |
            The maximum length of the subject field allowed in new credential records.
            There is no limit on the subject field length when querying existing records.
          type: integer
          format: int32
        maxValueLength:
          description: |
            The maximum length of a claim value allowed in new credential records.
            There is no limit on the claim value length when querying existing records.
          type: integer
          format: int32
        eventRetentionDays:
          description: |
            How many days the events of archived records are kept, and how old `synchronizerTimes` may be.
            Also bounds lookups of archived records.
          type: integer
          format: int32
      required:
        - maxPageSize
        - maxNumClaims
        - maxPropertyLength
        - maxSubjectLength
        - maxValueLength
        - eventRetentionDays

    SynchronizerTime:
      type: object
      description: |
        A synchronizer id paired with a record time on that synchronizer.
        Record times of different synchronizers are not comparable to each other.
        A result at this time includes the events at this record time.
      properties:
        synchronizerId:
          type: string
          description: "The id of the synchronizer."
        recordTime:
          type: string
          format: date-time
          description: |
            A record time on that synchronizer.
      required:
        - synchronizerId
        - recordTime

    ListCredentialsRequest:
      type: object
      description: "The request for listing credential records."
      properties:
        property:
          type: string
          description: |
            Only return credential records that contain at least one claim with this property.
            The value matches the whole property, not a prefix.
        issuer:
          type: string
          description: |
            Only return credential records issued by the specified party.
            Requires property.
        holder:
          type: string
          description: |
            Only return credential records held by the specified party.
            Requires property and issuer.
        subject:
          type: string
          description: |
            Only return credential records that contain a claim with this subject.
            Requires property, issuer, and holder.
            A claim matches when its subject equals this value, or when its subject is unset and this value is the textual party id of the holder.
        effectiveOnly:
          type: boolean
          default: false
          description: |
            If true, only return records whose validity period covers the `recordTime` of their synchronizer.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate at these times instead of the latest processed ones, each synchronizer at its own time.
            Records on synchronizers not listed are not returned.
            Use times from a prior response. Older than `limits.eventRetentionDays`: 400. Not yet processed: 503.
        limit:
          type: integer
          format: int32
          description: |
            The maximum number of credential records to return.
        after:
          $ref: "#/components/schemas/CredentialCursor"
          description: |
            The cursor of the last credential record received in a previous response,
            sent with the same filters and synchronizerTimes. Omit to start from the beginning.
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.
      required:
        - property

    ListCredentialsResponse:
      type: object
      description: "The response for listing credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The list of credential records matching the provided filters.
        next:
          $ref: "#/components/schemas/CredentialCursor"
          description: |
            Pass as after to continue. Omitted if there are no more results.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - credentials
        - synchronizerTimes

    CredentialCursor:
      type: object
      description: |
        The position of a credential record in the order of listCredentials:
        synchronizerId ascending, then recordTime descending, then contractId ascending.
      properties:
        synchronizerId:
          type: string
        recordTime:
          type: string
          format: date-time
        contractId:
          type: string
      required:
        - synchronizerId
        - recordTime
        - contractId

    ListCredentialsSnapshotRequest:
      type: object
      description: "The request for listing a snapshot of all active credential records."
      properties:
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate at these times instead of the latest processed ones, each synchronizer at its own time.
            Records on synchronizers not listed are not returned.
            Use times from a prior response. Older than `limits.eventRetentionDays`: 400. Not yet processed: 503.
        after:
          type: string
          description: |
            The contractId of the last credential record received in a previous response. Omit to start from the beginning.
        limit:
          type: integer
          format: int32
          description: |
            The maximum number of credential records to return.
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.

    ListCredentialsSnapshotResponse:
      type: object
      description: "The response for listing a snapshot of all active credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The credential records in this page of the snapshot.
        next:
          type: string
          description: |
            Pass as after to continue. Omitted if there are no more results.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - credentials
        - synchronizerTimes

    LookupCredentialRequest:
      type: object
      description: "The request for looking up a single credential record by contractId."
      properties:
        contractId:
          type: string
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate at these times instead of the latest processed ones, each synchronizer at its own time.
            Records on synchronizers not listed are not returned.
            Use times from a prior response. Older than `limits.eventRetentionDays`: 400. Not yet processed: 503.
        includeDisclosedContracts:
          type: boolean
          default: false
        excludeDebugFields:
          type: boolean
          default: false
      required:
        - contractId

    LookupCredentialResponse:
      type: object
      description: "The response for looking up a single credential record by contractId."
      properties:
        status:
          type: string
          enum:
            - active
            - archived
        credential:
          $ref: "#/components/schemas/Credential"
          description: Present when status is active.
        archived:
          $ref: "#/components/schemas/SynchronizerTime"
          description: Present when status is archived. The synchronizer and record time of the archive.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - status
        - synchronizerTimes

    ListCredentialSynchronizersResponse:
      type: object
      properties:
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
      required:
        - synchronizerTimes

    CredentialEvent:
      type: object
      properties:
        eventType:
          type: string
          enum:
            - create
            - archive
        recordTime:
          type: string
          format: date-time
        contractId:
          type: string
        credentialView:
          type: object
          description: Present when eventType is create. Schema of Splice.Api.Credential.RecordV1.CredentialView.
      required:
        - eventType
        - recordTime
        - contractId

    ListCredentialEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/CredentialEvent"
      required:
        - events

    Credential:
      type: object
      description: |
        A credential record stored in the registry.
      properties:
        contractId:
          type: string
          description: The contract id of the credential record.
        synchronizerId:
          type: string
          description: |
            The synchronizer the record is assigned to at the synchronizer time the result was computed at.
            While the record is being reassigned, the synchronizer it was last assigned to.
        recordTime:
          type: string
          format: date-time
          description: |
            Sequencing time of the confirmation request that created this credential contract.
            Not CredentialView.createdAt.
        credentialView:
          type: object
          description: |
            The view computed for the credential with the schema of Splice.Api.Credential.RecordV1.CredentialView.
        disclosedContract:
          $ref: "#/components/schemas/DisclosedContract"
          description: |
            The disclosed contract information for verifying the credential record using explicit contract disclosure.
      required:
        [
          "contractId",
          "synchronizerId",
          "recordTime",
          "credentialView",
        ]

    DisclosedContract:
      type: object
      description: |
        A contract that is disclosed for use with explicit contract disclosure
        when preparing transactions on validator nodes that do not know this contract.
      properties:
        templateId:
          type: string
          description: "The template ID of the disclosed contract."
        contractId:
          type: string
          description: "The contract ID of the disclosed contract."
        createdEventBlob:
          type: string
          description: |
            The binary-encoded created event of the disclosed contract.
            This blob can be used to prepare transactions on validator
            nodes that do not know this contract. This is done using
            explicit contract disclosure, where the created event is
            provided alongside the command that refers to the contract.
        synchronizerId:
          description: |
            The synchronizer to which the contract is assigned at the synchronizer time the result was computed at.
          type: string
        debugPackageName:
          description: |
            The name of the Daml package that was used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
        debugPayload:
          description: |
            The contract arguments that were used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: object
        debugCreatedAt:
          description: |
            The ledger effective time at which the contract was created.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
          format: date-time
      required:
        [
          "templateId",
          "contractId",
          "createdEventBlob",
          "synchronizerId"
        ]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
