openapi: 3.0.0
info:
  title: Credential registry query API
  description: |
    Read-only HTTP API for querying the credential records of a credential registry.
    Registries SHOULD implement it.
    Record schema: Daml package `splice-api-credential-record-v1`.

    The registry serves the credential records on its synchronizer, see `synchronizerId` in `/info`.
    Records reassigned to the registry's synchronizer are not served: they arrive with their original LET
    and would change results already served.
    Results are ordered and computed by ledger effective time (LET): `asOf` selects the records
    created at or before `asOf` and not archived at or before it.
    The registry publishes events only up to `publishedUntil`, which trails the latest processed
    record time by the maximal LET skew, so that no later event can have a LET at or before it.
    The skew is a configured upper bound on the synchronizer's ledger time tolerance,
    and `publishedUntil` never decreases.
    A result at an `asOf` not after `publishedUntil` is therefore the same on every backend of the registry.

    Timestamps are strings in RFC 3339 format, in UTC, with exactly six fractional digits,
    e.g. `2026-11-25T10:00:00.000000Z`, so that equal times are equal strings.
  version: 1.0.0
paths:

  /registry/credential-query/v1/info:
    get:
      operationId: "getCredentialRegistryInfo"
      description: |
        Get information about the credential registry.
        Useful to discover the admin party, the synchronizer, and the supported versions of the credential registry standard.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetCredentialRegistryInfoResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/published-until:
    get:
      operationId: "getPublishedUntil"
      description: |
        The latest ledger effective time up to which the registry has published all events.
        Pass it as `asOf` to get the same result from every backend of the registry.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetPublishedUntilResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/credentials:
    post:
      operationId: "listCredentials"
      description: |
        List the active credential records matching the filters, computed at `asOf`.
        All filters are optional; `property`, `issuer`, `holder`, and `subject` are set in that order.
        A filter without the ones before it is rejected with 400.
        Without filters, this lists a snapshot of all active credential records.

        Results are ordered by `ledgerEffectiveTime` descending, then `contractId` ascending.
        With all four filters and `effectiveOnly`, the first record is the last-write-wins record.

        Continue with `next` as `after` and the response's `asOf`. A page holds `min(limit, limits.maxPageSize)` records, except the last.
        After a snapshot, read `/events` after the response's `asOf`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCredentialsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

  /registry/credential-query/v1/credentials/lookup:
    post:
      operationId: "lookupCredential"
      description: |
        Look up an active credential record by `contractId`, computed at `asOf`.
        Responds with 404 if the record does not exist or is archived at `asOf`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupCredentialRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupCredentialResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

  /registry/credential-query/v1/events:
    get:
      operationId: "listCredentialEvents"
      description: |
        Create and archive events, ordered by `ledgerEffectiveTime` ascending, then `contractId` ascending.
        Events with the same `ledgerEffectiveTime` and `contractId` stay on one page,
        so a page may hold one event more than `limit`.

        Start from a snapshot: list `/credentials` without filters and with `effectiveOnly` false,
        then read events with `afterLedgerEffectiveTime` set to the snapshot's `asOf`.
        Resume with `afterLedgerEffectiveTime` and `afterContractId` of the last processed event.
        Without `afterContractId`, only events with a ledger effective time after `afterLedgerEffectiveTime` are returned.
        An empty response means the client has caught up to the response's `untilLedgerEffectiveTime`.

        Events of records archived more than `limits.eventRetentionSeconds` ago MAY be pruned.
        If events after the given position were pruned, this responds with 400; restart from a snapshot.
      parameters:
        - in: query
          name: limit
          description: "The maximum number of events to return, at most `limits.maxPageSize`. Defaults to `limits.maxPageSize`."
          schema:
            type: integer
            format: int32
          required: false
        - in: query
          name: afterLedgerEffectiveTime
          description: "Ledger effective time of the last processed event, or the snapshot's `asOf`."
          schema:
            type: string
          required: true
        - in: query
          name: afterContractId
          description: "Contract id of the last processed event. Requires `afterLedgerEffectiveTime`."
          schema:
            type: string
          required: false
        - in: query
          name: untilLedgerEffectiveTime
          description: |
            Only return events with a ledger effective time at or before this time.
            Defaults to `publishedUntil`. Later than `publishedUntil`: 503.
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialEventsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"

components:
  responses:
    "400":
      description: "bad request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "404":
      description: "not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "503":
      description: |
        The requested time is later than the registry's `publishedUntil`.
        Retry later, or against another backend of the registry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GetCredentialRegistryInfoResponse:
      type: object
      properties:
        adminId:
          description: "The Daml party of the credential registry administrator"
          type: string
        synchronizerId:
          description: "The synchronizer whose credential records the registry serves."
          type: string
        supportedVersions:
          description: "The versions of the credential registry standard supported by this registry"
          type: array
          items:
            type: integer
            format: int32
        limits:
          $ref: "#/components/schemas/CredentialRegistryLimits"
      required:
        - adminId
        - synchronizerId
        - supportedVersions
        - limits

    GetPublishedUntilResponse:
      type: object
      properties:
        publishedUntil:
          type: string
          description: |
            The latest ledger effective time up to which all events are published.
            No event published later has a ledger effective time at or before it.
      required:
        - publishedUntil

    CredentialRegistryLimits:
      type: object
      description: "The limits of the credential registry"
      properties:
        maxPageSize:
          description: "The maximum page size supported by the registry for listing credential records"
          type: integer
          format: int32
        maxNumClaims:
          description: |
            The maximum number of claims allowed in new credential records.
            There is no limit on the number of claims when querying existing records.
          type: integer
          format: int32
        maxPropertyLength:
          description: |
            The maximum length of a property allowed in new credential records.
            There is no limit on the property length when querying existing records.
          type: integer
          format: int32
        maxSubjectLength:
          description: |
            The maximum length of the subject field allowed in new credential records.
            There is no limit on the subject field length when querying existing records.
          type: integer
          format: int32
        maxValueLength:
          description: |
            The maximum length of a claim value allowed in new credential records.
            There is no limit on the claim value length when querying existing records.
          type: integer
          format: int32
        eventRetentionSeconds:
          description: "How long events of archived records are kept, in seconds. At least `maxAsOfLagSeconds`."
          type: integer
          format: int32
        maxAsOfLagSeconds:
          description: "How far `asOf` may be behind `publishedUntil`, in seconds."
          type: integer
          format: int32
      required:
        - maxPageSize
        - maxNumClaims
        - maxPropertyLength
        - maxSubjectLength
        - maxValueLength
        - eventRetentionSeconds
        - maxAsOfLagSeconds

    ListCredentialsRequest:
      type: object
      description: "The request for listing credential records."
      properties:
        property:
          type: string
          description: |
            Only return credential records that contain at least one claim with this property.
            The value matches the whole property, not a prefix.
        issuer:
          type: string
          description: |
            Only return credential records issued by the specified party.
            Requires property.
        holder:
          type: string
          description: |
            Only return credential records held by the specified party.
            Requires property and issuer.
        subject:
          type: string
          description: |
            Only return credential records that contain a claim with this subject.
            Requires property, issuer, and holder.
            A claim matches when its subject equals this value, or when its subject is unset and this value is the textual party id of the holder.
        effectiveOnly:
          type: boolean
          default: false
          description: |
            If true, only return records whose validity period covers `asOf`:
            `validFrom`, if set, is at or before `asOf`, and `validUntil`, if set, is after `asOf`.
            `expiresAt` is not checked, as it does not affect which record is the latest.
        asOf:
          type: string
          description: |
            Evaluate at this ledger effective time instead of `publishedUntil`.
            Use the `asOf` of a prior response, or `publishedUntil`.
            More than `limits.maxAsOfLagSeconds` behind `publishedUntil`: 400. Later than `publishedUntil`: 503.
        limit:
          type: integer
          format: int32
          description: |
            The maximum number of credential records to return. Defaults to `limits.maxPageSize`.
        after:
          $ref: "#/components/schemas/CredentialCursor"
          description: |
            The cursor of the last credential record received in a previous response,
            sent with the same filters and the response's `asOf`. Omit to start from the beginning.
        contractFormat:
          $ref: "#/components/schemas/ContractFormat"

    ListCredentialsResponse:
      type: object
      description: "The response for listing credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The list of credential records matching the provided filters.
        next:
          $ref: "#/components/schemas/CredentialCursor"
          description: |
            Pass as after to continue. Omitted if there are no more results.
        asOf:
          type: string
          description: |
            The ledger effective time the result was computed at.
      required:
        - credentials
        - asOf

    CredentialCursor:
      type: object
      description: |
        The position of a credential record in the order of listCredentials:
        ledgerEffectiveTime descending, then contractId ascending.
      properties:
        ledgerEffectiveTime:
          type: string
          description: Ledger effective time of the last record received.
        contractId:
          type: string
          description: Contract id of the last record received.
      required:
        - ledgerEffectiveTime
        - contractId

    ContractFormat:
      type: object
      description: "How credential records are returned."
      properties:
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.

    LookupCredentialRequest:
      type: object
      description: "The request for looking up a single active credential record by contractId."
      properties:
        contractId:
          type: string
          description: The contract id of the credential record.
        asOf:
          type: string
          description: |
            Evaluate at this ledger effective time instead of `publishedUntil`.
            More than `limits.maxAsOfLagSeconds` behind `publishedUntil`: 400. Later than `publishedUntil`: 503.
        contractFormat:
          $ref: "#/components/schemas/ContractFormat"
      required:
        - contractId

    LookupCredentialResponse:
      type: object
      description: "The response for looking up a single active credential record by contractId."
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        asOf:
          type: string
          description: |
            The ledger effective time the result was computed at.
      required:
        - credential
        - asOf

    CredentialEvent:
      type: object
      properties:
        eventType:
          type: string
          description: Whether the record was created or archived.
          enum:
            - create
            - archive
        ledgerEffectiveTime:
          type: string
          description: The ledger effective time of the transaction that created or archived the record.
        contractId:
          type: string
          description: The contract id of the credential record.
        credentialView:
          type: object
          description: Present when eventType is create. Schema of Splice.Api.Credential.RecordV1.CredentialView.
      required:
        - eventType
        - ledgerEffectiveTime
        - contractId

    ListCredentialEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/CredentialEvent"
        untilLedgerEffectiveTime:
          type: string
          description: The upper bound the events were read up to, as requested or `publishedUntil`.
      required:
        - events
        - untilLedgerEffectiveTime

    Credential:
      type: object
      description: |
        A credential record stored in the registry.
      properties:
        contractId:
          type: string
          description: The contract id of the credential record.
        ledgerEffectiveTime:
          type: string
          description: |
            Ledger effective time of the transaction that created this credential contract.
            Not CredentialView.createdAt.
        credentialView:
          type: object
          description: |
            The view computed for the credential with the schema of Splice.Api.Credential.RecordV1.CredentialView.
        disclosedContract:
          $ref: "#/components/schemas/DisclosedContract"
          description: |
            The disclosed contract information for verifying the credential record using explicit contract disclosure.
      required:
        [
          "contractId",
          "ledgerEffectiveTime",
          "credentialView",
        ]

    DisclosedContract:
      type: object
      description: |
        A contract that is disclosed for use with explicit contract disclosure
        when preparing transactions on validator nodes that do not know this contract.
      properties:
        templateId:
          type: string
          description: "The template ID of the disclosed contract."
        contractId:
          type: string
          description: "The contract ID of the disclosed contract."
        createdEventBlob:
          type: string
          description: |
            The binary-encoded created event of the disclosed contract.
            This blob can be used to prepare transactions on validator
            nodes that do not know this contract. This is done using
            explicit contract disclosure, where the created event is
            provided alongside the command that refers to the contract.
        synchronizerId:
          description: |
            The synchronizer to which the contract is assigned.
          type: string
        debugPackageName:
          description: |
            The name of the Daml package that was used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
        debugPayload:
          description: |
            The contract arguments that were used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: object
        debugCreatedAt:
          description: |
            The ledger effective time at which the contract was created.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
      required:
        [
          "templateId",
          "contractId",
          "createdEventBlob",
          "synchronizerId"
        ]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
