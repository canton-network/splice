sdk-version: 3.5.2
name: splice-api-token-conditional-lock-v1
version: 0.2.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-current.dar
- ../splice-api-token-holding-v2/.daml/dist/splice-api-token-holding-v2-current.dar
build-options:
  - --explicit-serializable=yes
  - --target=2.1
codegen:
