include required("include/canton-basic.conf")
include required("include/participants.conf")
include required("include/sequencers.conf")
include required("include/mediators.conf")

# sv1 sequencer and mediator with auto init disabled, to match the prod docker images.
# The participant auto-inits in prod, so tests that start apps against it
# should also load standalone-participant-sv1-auto-init.conf.
canton {
  parameters {
    non-standard-config = yes
  }

  participants {
    sv1StandaloneParticipant = ${_participant_template} {
      admin-api.port = 27102
      ledger-api {
        port = 27101
        user-management-service.additional-admin-user-id = ${SV1_ADMIN_USER}
      }
      http-ledger-api.enabled = false
      storage.config.properties.databaseName = ${SV1_PARTICIPANT_DB}
    }
  }

  sequencers {
    sv1StandaloneSequencer = ${_sequencer_reference_template} {
      public-api.port = 27108
      admin-api.port = 27109
      storage.config.properties.databaseName = ${SV1_SEQUENCER_DB}
      sequencer.config.storage.config.properties.databaseName = ${SEQUENCER_DRIVER_DB}
    }
  }

  mediators {
    sv1StandaloneMediator = ${_mediator_template} {
      admin-api.port = 27107
      storage.config.properties.databaseName = ${SV1_MEDIATOR_DB}
    }
  }
}
