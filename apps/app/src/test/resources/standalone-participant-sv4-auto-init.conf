# Lets Canton initialize this participant. Loaded by withCantonSvNodes
# unless a test sets this node's identity up itself.
canton.participants.sv4StandaloneParticipant.init {
  generate-topology-transactions-and-keys = true
  identity.type = auto
  identity.identifier.type = explicit
  identity.identifier.name = "sv4"
  identity.identifier.name = ${?SV4_PARTICIPANT_IDENTIFIER}
}
