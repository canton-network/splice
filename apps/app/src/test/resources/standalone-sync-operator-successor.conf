# The successor synchronizer node for a sync operator LSU. Left uninitialized on purpose: the
# operator's LSU trigger initializes both nodes from the synchronizer it is upgrading.
include required("include/canton-basic.conf")
include required("include/sequencers.conf")
include required("include/mediators.conf")

canton {
  parameters {
    non-standard-config = yes
  }

  sequencers {
    syncOperatorSuccessorSequencer = ${_sequencer_reference_template} {
      public-api.port = 27608
      admin-api.port = 27609
      storage.config.properties.databaseName = "sequencer_sync_operator_successor"
      sequencer.config.storage.config.properties.databaseName = "sequencer_driver_sync_operator_successor"
    }
    syncOperatorSuccessorSequencer.storage.config.properties.databaseName = ${?SYNC_OPERATOR_SUCCESSOR_SEQUENCER_DB}
    syncOperatorSuccessorSequencer.sequencer.config.storage.config.properties.databaseName = ${?SYNC_OPERATOR_SUCCESSOR_SEQUENCER_DRIVER_DB}
  }

  mediators {
    syncOperatorSuccessorMediator = ${_mediator_template} {
      admin-api.port = 27607
      storage.config.properties.databaseName = "mediator_sync_operator_successor"
    }
    syncOperatorSuccessorMediator.storage.config.properties.databaseName = ${?SYNC_OPERATOR_SUCCESSOR_MEDIATOR_DB}
  }
}
