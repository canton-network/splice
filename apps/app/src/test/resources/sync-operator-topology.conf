# Adds a sync operator app to a base topology.
#
# It runs against the splitwell synchronizer's sequencer for now, until the test topologies
# include a dedicated synchronizer.
canton {
  validator-apps {
    splitwellValidator {
      app-instances {
        syncOperator {
          service-user = "sync_operator_user"
          dars = []
        }
      }
    }
  }

  sync-operator-apps {
    syncOperator {
      include required("include/scan-client")
      storage = ${_shared.storage}
      storage.config.properties.databaseName = "splice_apps"
      instance-lock-enabled = false
      admin-api.address = 0.0.0.0
      admin-api.port = 5116
      participant-client = ${canton.validator-apps.splitwellValidator.participant-client}
      operator-user = ${canton.validator-apps.splitwellValidator.app-instances.syncOperator.service-user}
      synchronizer-nodes.current.sequencer.admin-api.port = 5709
    }
  }
}
