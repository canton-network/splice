include required("include/participants.conf")

_validatorParticipant_client {
  admin-api.port = 5902
  ledger-api.port = 5901
  http-ledger-api {
    port = 6901
  }
  ledger-api.user-management-service.additional-admin-user-id = ${VALIDATOR_ADMIN_USER}
  storage.type = memory
}

canton {
  parameters {
    non-standard-config = yes
  }
  # TODO(DACH-NY/cn-test-failures#11650): remove once Canton fixes it
  monitoring.logging.log-config-on-startup = false
  participants {
    validatorParticipant = ${_participant_template} ${_validatorParticipant_client}
    validatorParticipant.init.identity.identifier.name = ${VALIDATOR_IDENTIFIER}
  }
}
