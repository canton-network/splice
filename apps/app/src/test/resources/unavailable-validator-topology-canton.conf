include required("include/participants.conf")

_validatorParticipant_client {
  admin-api.port = 5902
  ledger-api.port = 5901
  http-ledger-api {
    port = 6901
  }
  ledger-api.user-management-service.additional-admin-user-id = ${VALIDATOR_ADMIN_USER}
  storage.type = memory
}

canton {
  parameters {
    non-standard-config = yes
  }
  participants {
    validatorParticipant = ${_participant_template} ${_validatorParticipant_client}
    validatorParticipant.init {
      generate-topology-transactions-and-keys = true
      identity.type = auto
      identity.identifier.type = explicit
      identity.identifier.name = ${VALIDATOR_IDENTIFIER}
    }
  }
}
