# Undoes `_autoInit_enabled` for a node whose identity comes from somewhere
# else - an identities dump, or a root namespace key held offline. Include it
# inside a participant's `init { }` block.
#
# `identity = null` has to come first: HOCON merges objects on duplicate keys,
# so without it the auto-init `identity.identifier` survives into the manual
# config, and Canton rejects that because `manual` takes no identifier.
identity = null
identity = { type = manual }
generate-topology-transactions-and-keys = false
