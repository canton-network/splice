# Re-enables what `_participant_template` in participants.conf turns off.
# Canton's own defaults are `identity.type = auto` and
# `generate-topology-transactions-and-keys = true`, so this undoes our
# template rather than restating Canton. Include it inside a participant's
# `init { }` block and add the identifier name alongside.
generate-topology-transactions-and-keys = true
identity.type = auto
identity.identifier.type = explicit
