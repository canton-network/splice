# Turns auto-init back on for an extra participant that is a plain validator
# node, undoing the opt-out in standalone-participant-extra.conf. Re-applies
# the template's `init` outright rather than merging, so nothing of the opt-out
# survives, then adds the node identifier the template cannot know.
canton.participants.extraStandaloneParticipant.init = ${_participant_template.init} {
  identity.identifier.name = ${EXTRA_PARTICIPANT_IDENTIFIER}
}
