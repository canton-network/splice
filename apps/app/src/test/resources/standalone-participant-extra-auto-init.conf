# Turns the template's auto-init back on for an extra participant that is a
# plain validator node, undoing the opt-out in standalone-participant-extra.conf.
# Assigns `init` outright rather than merging, so nothing of the opt-out survives.
canton.participants.extraStandaloneParticipant.init = {
  generate-topology-transactions-and-keys = true
  identity.type = auto
  identity.identifier.type = explicit
  identity.identifier.name = ${EXTRA_PARTICIPANT_IDENTIFIER}
}
