participantAdminUserNameFrom:
  secretKeyRef:
    key: ledger-api-user
    name: splice-app-validator-ledger-api-auth
    optional: false

persistence:
  secretName: postgres-secrets
  host: postgres
  databaseName: participant_MIGRATION_ID
  schema: participant

# Enable only if needed, e.g., while restoring the validator from an identities dump or importing an ACS.
enableRepairCommands: false
# Replace YOUR_VALIDATOR_NODE_NAME with the name you provided for your validator identity.
# Must match the nodeIdentifier in your standalone-validator-values.yaml.
nodeIdentifier: "YOUR_VALIDATOR_NODE_NAME"
