openapi: 3.0.0
info:
  title: SV Streaming API
  version: 0.0.1
tags:
  - name: sv
servers:
  - url: https://example.com/api/sv
paths:

  /v0/onboard/sv/download/{id}:
    get:
      tags: [sv]
      x-jvm-package: sv_public_stream
      x-external-audience: svs
      operationId: "onboardSvDownload"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The response body contains the exported snapshot file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-scala-type: org.apache.pekko.http.scaladsl.model.ResponseEntity
        "202":
          description: |
            The export is queued or still running. Retry the download with the same ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OnboardSvDownloadPendingResponse"
        "404":
          description: |
            The sponsor does not know this ID. Call prepare again to get a new ID.
          content:
            application/json:
              schema:
                "$ref": "../../../../common/src/main/openapi/common-external.yaml#/components/schemas/ErrorResponse"
        "410":
          description: |
            The export with this ID failed or its snapshot is no longer usable.
            Call prepare again to get a new ID.
          content:
            application/json:
              schema:
                "$ref": "../../../../common/src/main/openapi/common-external.yaml#/components/schemas/ErrorResponse"
        "500":
          description: |
            Unexpected error. Retry the download with the same ID.
          content:
            application/json:
              schema:
                "$ref": "../../../../common/src/main/openapi/common-external.yaml#/components/schemas/ErrorResponse"
        "503":
          description: |
            The sponsor is temporarily unavailable, for example during shutdown.
            Retry the download with the same ID.
          content:
            application/json:
              schema:
                "$ref": "../../../../common/src/main/openapi/common-external.yaml#/components/schemas/ErrorResponse"

  /v0/onboard/sv/sequencer:
    post:
      tags: [sv]
      x-jvm-package: sv_public_stream
      x-external-audience: svs
      operationId: "onboardSvSequencer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OnboardSvSequencerRequest"
      responses:
        "200":
          description: |
            The onboarding state of the sequencer, in the binary format expected by the
            sequencer's initialization endpoint. This is returned as a binary stream
            rather than as JSON as the onboarding state can exceed the 2GB limit of a JSON string.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-scala-type: org.apache.pekko.http.scaladsl.model.ResponseEntity
        "400":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/400"

components:
  schemas:
    OnboardSvDownloadPendingResponse:
      type: object
      required:
        - status
        - queued_at
      properties:
        status:
          type: string
          enum:
            - queued
            - exporting
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          description: Set once the export is running.
    OnboardSvSequencerRequest:
      type: object
      required:
        - sequencer_id
      properties:
        sequencer_id:
          type: string
