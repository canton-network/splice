openapi: 3.0.0
info:
  title: SV Streaming API
  version: 0.0.1
tags:
  - name: sv
servers:
  - url: https://example.com/api/sv
paths:

  /v0/onboard/sv/download/{id}:
    get:
      tags: [sv]
      x-jvm-package: sv_public_stream
      x-external-audience: svs
      operationId: "onboardSvDownload"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The exported snapshot.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-scala-type: org.apache.pekko.http.scaladsl.model.ResponseEntity
        "404":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/404"
        "500":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/500"
        "503":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/503"

  /v0/onboard/sv/sequencer:
    post:
      tags: [sv]
      x-jvm-package: sv_public_stream
      x-external-audience: svs
      operationId: "onboardSvSequencer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OnboardSvSequencerRequest"
      responses:
        "200":
          description: |
            The onboarding state of the sequencer, in the binary format expected by the
            sequencer's initialization endpoint. This is returned as a binary stream
            rather than as JSON as the onboarding state can exceed the 2GB limit of a JSON string.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-scala-type: org.apache.pekko.http.scaladsl.model.ResponseEntity
        "400":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/400"

components:
  schemas:
    OnboardSvSequencerRequest:
      type: object
      required:
        - sequencer_id
      properties:
        sequencer_id:
          type: string
