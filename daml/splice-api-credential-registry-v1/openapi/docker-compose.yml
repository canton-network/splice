# Description: Docker compose file for running Swagger UI with the read-only credential registry OpenAPI specification.
# The factory spec is mounted next to it as splice-api-credential-registry-update-v1.yaml.
# Usage: docker-compose up
version: '3.7'

services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /spec/splice-api-credential-registry-v1.yaml
    volumes:
      - ../../../credential-standard:/spec
