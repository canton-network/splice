# Config for a Canton sequencer with the default ports we use on our clusters forwarded to localhost.
# Use it to interact with a sequencer deployed to our cluster via k8s port forwarding.
# See `cncluster sequencer_console`.

canton {
  remote-mediators {
    mediator1 {
      admin-api {
        port = 11101
        address = localhost
      }
    }
    mediator2 {
      admin-api {
        port = 11201
        address = localhost
      }
    }
    mediator3 {
      admin-api {
        port = 11301
        address = localhost
      }
    }
    mediator4 {
      admin-api {
        port = 11401
        address = localhost
      }
    }
  }
  remote-sequencers {
    sequencer1 {
      public-api {
        port = 11102
        address = localhost
      }
      admin-api {
        port = 11103
        address = localhost
      }
    }
    sequencer2 {
      public-api {
        port = 11202
        address = localhost
      }
      admin-api {
        port = 11203
        address = localhost
      }
    }
    sequencer3 {
      public-api {
        port = 11302
        address = localhost
      }
      admin-api {
        port = 11303
        address = localhost
      }
    }
    sequencer4 {
      public-api {
        port = 11402
        address = localhost
      }
      admin-api {
        port = 11403
        address = localhost
      }
    }
    ownsequencer {
      public-api {
        port = 5008
        address = global-domain-1-sequencer
      }
      admin-api {
        port = 5009
        address = global-domain-1-sequencer
      }
    }
  }
  remote-participants {
    participant1 {
      admin-api {
        port = 11104
        address = localhost
      }
      ledger-api {
        port = 11105
        address = localhost
      }
    }
    participant2 {
      admin-api {
        port = 11204
        address = localhost
      }
      ledger-api {
        port = 11205
        address = localhost
      }
    }
    participant3 {
      admin-api {
        port = 11304
        address = localhost
      }
      ledger-api {
        port = 11305
        address = localhost
      }
    }
    participant4 {
      admin-api {
        port = 11404
        address = localhost
      }
      ledger-api {
        port = 11405
        address = localhost
      }
    }
  }
  #features.enable-preview-commands = yes
  #features.enable-testing-commands = yes
  #features.enable-repair-commands = yes
}
